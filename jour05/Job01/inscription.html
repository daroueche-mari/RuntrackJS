<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription</title>
</head>

<body>

    <header>
        <div class="navbar">
            <h1>Jour 05</h1>
            <div class="btn-log">
                <a href="inscription.html">
                    <button id="btn-signin">S'Inscrire</button>
                </a>
                <a href="connexion.html">
                    <button id="btn-signup">Se Connecter</button>
                </a>

            </div>
        </div>
    </header>

    <section>
        <form action="" class="myform">
            <fieldset>
                <div class="section-form">
                    <label for="name">Nom</label>
                    <input type="text" id="name" name="name_user" required>
                    <span class="error-text" id="err-firstname"></span>
                </div>
                <div class="section-form">
                    <label for="firstname">Prenom</label>
                    <input type="text" id="firstname" name="firstname_user" required>
                    <span class="error-text" id="err-firstname"></span>
                </div>
                <div class="section-form">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email_utilisateur" required>
                    <span class="error-text" id="err-firstname"></span>
                </div>
                <div class="section-form">
                    <label for="password">Mot de Passe</label>
                    <input type="password" id="password" name="password_user" required>
                    <span class="error-text" id="err-firstname"></span>
                </div>
                <div class="section-form">
                    <label for="adress">Adresse</label>
                    <input type="text" id="adress" name="adress_user" required>
                    <span class="error-text" id="err-firstname"></span>
                </div>
                <div class="section-form">
                    <label for="codepostal">Code Postal</label>
                    <input type="number" id="codepostal" name="codepostal_user" required>
                    <span class="error-text" id="err-firstname"></span>
                </div>
                <button id="form-signin">S'inscrire</button>
            </fieldset>
        </form>
    </section>
</body>

</html>
